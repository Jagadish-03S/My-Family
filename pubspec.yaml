name: my_family
description: "My Family 👪 - Private family application with bilingual support, AI face recognition, interactive family tree, memories, calendar, albums, and role security."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  uuid: ^4.4.0
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/quotes/
